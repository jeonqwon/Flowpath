<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reminders</title>
  <link rel="stylesheet" href="app-theme.css">
  <script src="mock-data.js"></script>
</head>
<body class="preview-body">
  <main class="app-screen has-sticky-header">
    <div class="topbar compact sticky-topbar">
      <h1 class="screen-title">Tuesday, Oct 6</h1>
      <a class="primary-button add-task-button" href="create_task.html?mode=task&from=reminders.html" aria-label="Add task">
        <span class="add-task-plus">+</span>
        <span>Add Task</span>
      </a>
    </div>

    <section class="stack" id="reminderList"></section>

    <nav class="bottom-nav">
      <a class="nav-link" href="tasks.html"><span>Tasks</span></a>
      <a class="nav-link" href="planner.html"><span>Planner</span></a>
      <a class="nav-link active" href="reminders.html"><strong>Reminders</strong></a>
      <a class="nav-link" href="combined_settings_edit.html"><span>Settings</span></a>
    </nav>
  </main>

  <script>
    const reminderList = document.getElementById('reminderList');
    const today = window.FocusPreviewData.DEFAULT_SCHEDULE_DATE;

    function renderReminders() {
      const sections = window.FocusPreviewData.reminderSections(today);
      if (!sections.length) {
        reminderList.innerHTML = `
          <article class="card soft list-card">
            <div>
              <h3 class="task-title">No reminders right now</h3>
            </div>
          </article>
        `;
        return;
      }

      reminderList.innerHTML = sections.map((section) => `
        <section class="blackboard-section">
          <p class="blackboard-label">${section.label}</p>
          <div class="card reminder-group-card ${section.label === 'Overdue' ? 'overdue-group-card' : ''}">
            ${section.items.map((item) => `
              <article class="reminder-row">
                <div class="reminder-row-main">
                  <h3 class="task-title">${item.title}</h3>
                  <p class="task-meta">${window.FocusPreviewData.formatShortDate(item.dueDate)} &middot; ${window.FocusPreviewData.formatTime(item.dueTime)}</p>
                  ${item.repeatNote ? `<p class="helper-copy">${item.repeatNote}</p>` : ''}
                </div>
                <div class="task-actions reminder-row-actions">
                  <button class="mini-action reminder-snooze" data-reminder-id="${item.id}" type="button">Snooze</button>
                  <button class="mini-action primary reminder-done" data-reminder-id="${item.id}" type="button">Done</button>
                </div>
              </article>
            `).join('')}
          </div>
        </section>
      `).join('');

      reminderList.querySelectorAll('.reminder-done').forEach((button) => {
        button.addEventListener('click', () => {
          window.FocusPreviewData.hideReminder(button.dataset.reminderId);
          renderReminders();
        });
      });

      reminderList.querySelectorAll('.reminder-snooze').forEach((button) => {
        button.addEventListener('click', () => {
          window.FocusPreviewData.snoozeReminder(button.dataset.reminderId, today);
          renderReminders();
        });
      });
    }

    renderReminders();
  </script>
</body>
</html>

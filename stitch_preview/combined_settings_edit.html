<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings</title>
  <link rel="stylesheet" href="app-theme.css">
  <script src="mock-data.js"></script>
</head>
<body class="preview-body">
  <main class="app-screen has-sticky-header settings-screen">
    <div class="topbar compact sticky-topbar settings-topbar">
      <div></div>
      <button id="editToggle" class="pill-button settings-toggle">Edit Flow</button>
    </div>

    <section class="timeline-shell">
      <div class="time-rail" id="timeRail"></div>
      <div class="timeline-layer" id="timelineLayer"></div>
    </section>

    <nav class="bottom-nav">
      <a class="nav-link" href="tasks.html"><span>Tasks</span></a>
      <a class="nav-link" href="planner.html"><span>Planner</span></a>
      <a class="nav-link" href="reminders.html"><span>Reminders</span></a>
      <a class="nav-link active" href="combined_settings_edit.html"><strong>Settings</strong></a>
    </nav>
  </main>

  <script>
    const toggle = document.getElementById('editToggle');
    const timelineShell = document.querySelector('.timeline-shell');
    const timeRail = document.getElementById('timeRail');
    const timelineLayer = document.getElementById('timelineLayer');
    const dayStart = '00:00';
    const dayEnd = '24:00';
    const minimumGapMinutes = 30;
    const HOUR_HEIGHT = 96;
    let periods = window.FocusPreviewData.loadPeriods();
    let mode = 'list';

    function normalizeForSettings(items) {
      return items.map((period) => {
        if (period.name === 'Sleep') {
          return { ...period, start: '22:00', end: '06:00', type: 'life' };
        }
        return period;
      });
    }

    function toMinutes(time) {
      const [h, m] = time.split(':').map(Number);
      return h * 60 + m;
    }

    function label24(minutes) {
      const h = String(Math.floor(minutes / 60)).padStart(2, '0');
      const m = String(minutes % 60).padStart(2, '0');
      return `${h}:${m}`;
    }

    function formatTime(time) {
      const [rawH, rawM] = time.split(':').map(Number);
      if (rawH === 24) {
        return `12:${String(rawM).padStart(2, '0')} AM`;
      }
      const suffix = rawH >= 12 ? 'PM' : 'AM';
      const h = rawH % 12 || 12;
      return `${h}:${String(rawM).padStart(2, '0')} ${suffix}`;
    }

    function formatRange(start, end) {
      return `${formatTime(start)} - ${formatTime(end)}`;
    }

    function escapeHtml(value) {
      return value.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');
    }

    function withGaps(items) {
      const expanded = items.flatMap((period) => {
        const start = toMinutes(period.start);
        const end = toMinutes(period.end);
        if (end <= start) {
          return [
            { ...period, start: '00:00', end: period.end, overflowPart: 'start' },
            { ...period, start: period.start, end: '24:00', overflowPart: 'end' }
          ];
        }
        return [period];
      });
      const sorted = [...expanded].sort((a, b) => toMinutes(a.start) - toMinutes(b.start));
      const segments = [];
      let cursor = dayStart;
      for (const period of sorted) {
        if (toMinutes(period.start) - toMinutes(cursor) >= minimumGapMinutes) {
          segments.push({ kind: 'gap', start: cursor, end: period.start });
        }
        segments.push({ kind: 'period', ...period });
        cursor = period.end;
      }
      if (toMinutes(dayEnd) - toMinutes(cursor) >= minimumGapMinutes) {
        segments.push({ kind: 'gap', start: cursor, end: dayEnd });
      }
      return segments;
    }

    function renderRail() {
      const totalMinutes = toMinutes(dayEnd) - toMinutes(dayStart);
      const heightPx = (totalMinutes / 60) * HOUR_HEIGHT;
      timelineShell.style.minHeight = `${heightPx}px`;
      timelineLayer.style.minHeight = `${heightPx}px`;
      const labels = [];
      for (let minutes = toMinutes(dayStart); minutes <= toMinutes(dayEnd); minutes += 60) {
        labels.push(`<div class="hour-label" style="top:${((minutes - toMinutes(dayStart)) / 60) * HOUR_HEIGHT}px;">${label24(minutes)}</div>`);
      }
      timeRail.innerHTML = labels.join('');
    }

    function renderTimeline() {
      periods = normalizeForSettings(window.FocusPreviewData.loadPeriods());
      const segments = withGaps(periods);
      timelineLayer.innerHTML = segments.map(segment => {
        const start = toMinutes(segment.start);
        const end = toMinutes(segment.end);
        const top = ((start - toMinutes(dayStart)) / 60) * HOUR_HEIGHT;
        const minHeightPx = mode === 'edit' ? 48 : 40;
        const height = Math.max(((end - start) / 60) * HOUR_HEIGHT, minHeightPx);

        if (segment.kind === 'gap') {
          if (mode === 'list') {
            return `<div class="timeline-blank" style="top:${top}px; height:${height}px;"></div>`;
          }
          return `<div class="timeline-gap" style="top:${top}px; height:${height}px;">
            <button data-start="${segment.start}" data-end="${segment.end}">+ Select Time Slot</button>
          </div>`;
        }

        return `<article class="timeline-card task-card card ${segment.type === 'life' ? 'soft' : ''}" style="top:${top}px; height:${height}px;" data-period-id="${segment.id}">
          <div class="timeline-content">
            <h3 class="timeline-title">${escapeHtml(segment.name)}</h3>
          </div>
          ${mode === 'edit' ? `<div class="task-actions" style="justify-content:flex-start; margin-top:auto;">
            <button class="mini-action edit-period" data-period-id="${segment.id}" type="button">Edit</button>
            <button class="mini-action delete-period" data-period-id="${segment.id}" type="button">Delete</button>
          </div>` : ``}
        </article>`;
      }).join('');

      if (mode === 'edit') {
        timelineLayer.querySelectorAll('.timeline-gap button').forEach(button => {
          button.addEventListener('click', () => {
            window.location.href = `add_new_period_dynamic.html?start=${encodeURIComponent(button.dataset.start)}&end=${encodeURIComponent(button.dataset.end)}`;
          });
        });

        timelineLayer.querySelectorAll('.edit-period').forEach((button) => {
          button.addEventListener('click', () => {
            const period = periods.find((item) => item.id === button.dataset.periodId);
            if (!period) return;
            const params = new URLSearchParams({
              id: period.id,
              name: period.name,
              type: period.type,
              start: period.start,
              end: period.end
            });
            window.location.href = `add_new_period_dynamic.html?${params.toString()}`;
          });
        });

        timelineLayer.querySelectorAll('.delete-period').forEach((button) => {
          button.addEventListener('click', () => {
            window.FocusPreviewData.deletePeriod(button.dataset.periodId);
            renderTimeline();
          });
        });
      }
    }

    toggle.addEventListener('click', () => {
      mode = mode === 'list' ? 'edit' : 'list';
      toggle.textContent = mode === 'edit' ? 'Done' : 'Edit Flow';
      renderTimeline();
    });

    renderRail();
    renderTimeline();
  </script>
</body>
</html>

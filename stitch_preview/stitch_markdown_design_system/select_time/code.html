<title>Select Time</title>

                      "xl": "0.75rem",

              "spacing": {

                      "lg": "24px",

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background antialiased min-h-screen pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-background/80 backdrop-blur-md">
<div class="flex items-center justify-between px-md h-touch-target w-full bg-background">
<button class="w-touch-target h-touch-target flex items-center justify-center text-on-surface hover:bg-surface-container-low transition-colors rounded-full active:scale-95 duration-100">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface">Select Time</h1>
<div class="w-touch-target h-touch-target"></div>
</div>
</header>
<main class="pt-[72px] px-md">
<!-- Helper Text -->
<p class="font-body-md text-body-md text-text-muted mb-lg">Choose an available time slot</p>
<!-- Timeline Container -->
<div class="relative w-full border-l border-border-subtle ml-xl pl-md pb-xl">
<!-- 8:00 AM - Occupied -->
<div class="absolute left-[-24px] top-0 font-label-xs text-label-xs text-text-muted bg-background py-1">08:00</div>
<div class="w-full bg-surface-container-low border border-border-subtle rounded-lg p-md mb-lg h-24 flex flex-col justify-center opacity-70">
<h3 class="font-subhead-sm text-subhead-sm text-secondary">Morning Focus</h3>
<p class="font-label-xs text-label-xs text-text-muted mt-1">8:00 AM - 10:00 AM</p>
</div>
<!-- 10:00 AM - Free (Selectable) -->
<div class="absolute left-[-24px] top-[120px] font-label-xs text-label-xs text-text-muted bg-background py-1">10:00</div>
<button class="w-full bg-surface border border-dashed border-primary/50 rounded-lg p-md mb-lg h-24 flex items-center justify-center hover:bg-surface-container-low transition-colors active:scale-[0.98] duration-150">
<span class="font-subhead-sm text-subhead-sm text-primary">+ Select Time Slot</span>
</button>
<!-- 12:00 PM - Occupied -->
<div class="absolute left-[-24px] top-[240px] font-label-xs text-label-xs text-text-muted bg-background py-1">12:00</div>
<div class="w-full bg-surface-container-low border border-border-subtle rounded-lg p-md mb-lg h-16 flex flex-col justify-center opacity-70">
<h3 class="font-subhead-sm text-subhead-sm text-secondary">Lunch Break</h3>
<p class="font-label-xs text-label-xs text-text-muted mt-1">12:00 PM - 1:00 PM</p>
</div>
<!-- 1:00 PM - Free (Selectable) -->
<div class="absolute left-[-24px] top-[328px] font-label-xs text-label-xs text-text-muted bg-background py-1">13:00</div>
<button class="w-full bg-surface border border-dashed border-primary/50 rounded-lg p-md mb-lg h-12 flex items-center justify-center hover:bg-surface-container-low transition-colors active:scale-[0.98] duration-150">
<span class="font-subhead-sm text-subhead-sm text-primary">+ Select Time Slot</span>
</button>
<!-- 2:00 PM - Selected Highlight -->
<div class="absolute left-[-24px] top-[400px] font-label-xs text-label-xs text-primary bg-background py-1 z-10">14:00</div>
<div class="relative w-full bg-primary/10 border-2 border-primary rounded-lg p-md mb-lg h-32 flex flex-col justify-between shadow-[0_4px_15px_rgba(0,0,0,0.05)]">
<!-- Drag Handle Top -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 w-8 h-2 bg-primary rounded-full cursor-ns-resize shadow-sm"></div>
<div>
<h3 class="font-subhead-sm text-subhead-sm text-primary">New Task Session</h3>
<p class="font-label-xs text-label-xs text-primary mt-1">2:00 PM - 3:30 PM (1.5h)</p>
</div>
<div class="flex justify-end">
<button class="text-primary hover:bg-primary/10 rounded-full p-2 transition-colors">
<span class="material-symbols-outlined text-[20px]">edit</span>
</button>
</div>
<!-- Drag Handle Bottom -->
<div class="absolute bottom-0 left-1/2 -translate-x-1/2 translate-y-1/2 w-8 h-2 bg-primary rounded-full cursor-ns-resize shadow-sm"></div>
</div>
<!-- 3:30 PM - Occupied -->
<div class="absolute left-[-24px] top-[552px] font-label-xs text-label-xs text-text-muted bg-background py-1">15:30</div>
<div class="w-full bg-surface-container-low border border-border-subtle rounded-lg p-md mb-lg h-24 flex flex-col justify-center opacity-70">
<h3 class="font-subhead-sm text-subhead-sm text-secondary">Team Sync</h3>
<p class="font-label-xs text-label-xs text-text-muted mt-1">3:30 PM - 5:00 PM</p>
</div>
<!-- 5:00 PM - Free (Selectable) -->
<div class="absolute left-[-24px] top-[672px] font-label-xs text-label-xs text-text-muted bg-background py-1">17:00</div>
<button class="w-full bg-surface border border-dashed border-primary/50 rounded-lg p-md h-16 flex items-center justify-center hover:bg-surface-container-low transition-colors active:scale-[0.98] duration-150">
<span class="font-subhead-sm text-subhead-sm text-primary">+ Select Time Slot</span>
</button>
<div class="absolute left-[-24px] top-[760px] font-label-xs text-label-xs text-text-muted bg-background py-1">18:00</div>
</div>
</main>
<!-- Sticky Bottom Button -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-border-subtle p-md pb-safe shadow-[0_-4px_15px_rgba(0,0,0,0.05)] z-40">
<button class="w-full h-touch-target bg-primary-container text-on-primary-container font-button-md text-button-md rounded-full shadow-md hover:bg-primary transition-colors active:scale-[0.98] duration-150 flex items-center justify-center gap-2">
            Confirm Time
        </button>
</div>
</body></html>

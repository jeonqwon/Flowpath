<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Time Selection - Focus</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "priority-medium": "#F59E0B",
                        "surface-tint": "#4d44e3",
                        "outline": "#777587",
                        "on-secondary-fixed-variant": "#424751",
                        "on-primary": "#ffffff",
                        "tertiary-fixed-dim": "#d2bbff",
                        "on-secondary-container": "#60646f",
                        "surface-container-low": "#f3f4f5",
                        "on-primary-fixed-variant": "#3323cc",
                        "on-background": "#191c1d",
                        "secondary-container": "#dee2ef",
                        "secondary-fixed-dim": "#c2c6d3",
                        "surface-container-highest": "#e1e3e4",
                        "text-muted": "#6B7280",
                        "inverse-on-surface": "#f0f1f2",
                        "surface-dim": "#d9dadb",
                        "surface": "#FFFFFF",
                        "surface-bright": "#f8f9fa",
                        "background": "#f8f9fa",
                        "secondary": "#5a5e69",
                        "tertiary": "#5c00ca",
                        "surface-container": "#edeeef",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#e7e8e9",
                        "on-tertiary-container": "#e4d4ff",
                        "on-error": "#ffffff",
                        "primary-container": "#4f46e5",
                        "inverse-surface": "#2e3132",
                        "inverse-primary": "#c3c0ff",
                        "tertiary-container": "#7531e6",
                        "outline-variant": "#c7c4d8",
                        "text-main": "#111827",
                        "priority-high": "#EF4444",
                        "surface-variant": "#e1e3e4",
                        "on-primary-container": "#dad7ff",
                        "border-subtle": "#E5E7EB",
                        "primary-fixed": "#e2dfff",
                        "primary": "#3525cd",
                        "secondary-fixed": "#dee2ef",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#171c25",
                        "primary-fixed-dim": "#c3c0ff",
                        "on-surface-variant": "#464555",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#5a00c6",
                        "priority-low": "#10B981",
                        "on-surface": "#191c1d",
                        "tertiary-fixed": "#eaddff",
                        "on-primary-fixed": "#0f0069",
                        "on-tertiary-fixed": "#25005a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch-target": "48px",
                        "sm": "8px",
                        "md": "16px",
                        "lg": "24px",
                        "xs": "4px",
                        "xl": "32px",
                        "margin-screen": "16px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "subhead-sm": ["Inter"],
                        "label-xs": ["Inter"],
                        "button-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "subhead-sm": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "label-xs": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "button-md": ["16px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "headline-md": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col pb-safe">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-background/80 backdrop-blur-md bg-background">
<div class="flex items-center justify-between px-md h-touch-target w-full">
<button class="flex items-center justify-center h-touch-target w-touch-target text-on-surface-variant hover:bg-surface-container-low transition-colors rounded-full active:scale-95 duration-100">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface">Select Time</h1>
<button class="flex items-center justify-center h-touch-target w-touch-target text-on-surface-variant hover:bg-surface-container-low transition-colors rounded-full active:scale-95 duration-100">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 mt-16 px-md py-lg flex flex-col gap-lg max-w-2xl mx-auto w-full">
<!-- Digital Readout -->
<section class="bg-surface border border-border-subtle rounded-xl p-md shadow-sm flex flex-col gap-md">
<div class="flex justify-between items-center">
<div class="flex flex-col">
<span class="font-label-xs text-label-xs text-text-muted mb-1">Start Time</span>
<div class="flex items-end gap-2">
<span class="font-display-lg text-display-lg text-on-surface">14:00</span>
</div>
</div>
<div class="h-8 w-px bg-border-subtle"></div>
<div class="flex flex-col items-end">
<span class="font-label-xs text-label-xs text-text-muted mb-1">End Time</span>
<div class="flex items-end gap-2">
<span class="font-display-lg text-display-lg text-on-surface">15:30</span>
</div>
</div>
</div>
<div class="flex justify-between items-center pt-sm border-t border-border-subtle">
<span class="font-label-xs text-label-xs text-text-muted">Duration: 1h 30m</span>
<button class="text-primary font-subhead-sm text-subhead-sm flex items-center gap-1">
<span class="material-symbols-outlined" style="font-size: 16px;">edit</span>
                    Manual Entry
                </button>
</div>
</section>
<!-- Timeline Visualization -->
<section class="bg-surface border border-border-subtle rounded-xl shadow-sm overflow-hidden flex-1 relative flex flex-col">
<div class="p-md border-b border-border-subtle flex justify-between items-center bg-surface-bright sticky top-0 z-10">
<h2 class="font-subhead-sm text-subhead-sm text-on-surface">Today's Schedule</h2>
<span class="font-label-xs text-label-xs text-text-muted">Thu, Oct 24</span>
</div>
<div class="overflow-y-auto flex-1 relative px-md py-md" style="height: 400px;">
<!-- Grid Lines -->
<div class="absolute inset-0 px-md py-md pointer-events-none flex flex-col">
<!-- Hour blocks - using 48px standard -->
<div class="h-[48px] border-t border-border-subtle flex items-start -ml-2">
<span class="font-label-xs text-label-xs text-text-muted bg-surface pr-2 -mt-2 text-[10px]">12:00</span>
</div>
<div class="h-[48px] border-t border-border-subtle flex items-start -ml-2">
<span class="font-label-xs text-label-xs text-text-muted bg-surface pr-2 -mt-2 text-[10px]">13:00</span>
</div>
<div class="h-[48px] border-t border-border-subtle flex items-start -ml-2">
<span class="font-label-xs text-label-xs text-text-muted bg-surface pr-2 -mt-2 text-[10px]">14:00</span>
</div>
<div class="h-[48px] border-t border-border-subtle flex items-start -ml-2">
<span class="font-label-xs text-label-xs text-text-muted bg-surface pr-2 -mt-2 text-[10px]">15:00</span>
</div>
<div class="h-[48px] border-t border-border-subtle flex items-start -ml-2">
<span class="font-label-xs text-label-xs text-text-muted bg-surface pr-2 -mt-2 text-[10px]">16:00</span>
</div>
<div class="h-[48px] border-t border-border-subtle flex items-start -ml-2">
<span class="font-label-xs text-label-xs text-text-muted bg-surface pr-2 -mt-2 text-[10px]">17:00</span>
</div>
<div class="h-[48px] border-t border-border-subtle flex items-start -ml-2">
<span class="font-label-xs text-label-xs text-text-muted bg-surface pr-2 -mt-2 text-[10px]">18:00</span>
</div>
</div>
<!-- Timeline Content Area (offset for labels) -->
<div class="ml-10 relative h-full pointer-events-auto">
<!-- Existing Block (Past) -->
<div class="absolute top-0 left-0 right-0 h-[48px] bg-surface-container-low border border-border-subtle rounded-md p-2 flex flex-col justify-center opacity-70">
<span class="font-subhead-sm text-subhead-sm text-secondary">Lunch Break</span>
<span class="font-label-xs text-label-xs text-text-muted">12:00 - 13:00</span>
</div>
<!-- Active Selection Block -->
<div class="absolute top-[96px] left-0 right-0 h-[72px] bg-secondary-container border-l-4 border-primary border-y border-r border-border-subtle rounded-md shadow-sm z-20 group cursor-ns-resize">
<!-- Top Drag Handle -->
<div class="absolute -top-3 left-1/2 -translate-x-1/2 w-8 h-6 flex items-center justify-center cursor-ns-resize opacity-0 group-hover:opacity-100 transition-opacity">
<div class="w-4 h-1 bg-primary rounded-full"></div>
</div>
<div class="p-2 flex flex-col justify-between h-full">
<div class="flex justify-between items-center">
<span class="font-subhead-sm text-subhead-sm text-on-surface">New Task Period</span>
<span class="font-label-xs text-label-xs text-primary font-bold">14:00 - 15:30</span>
</div>
<span class="font-label-xs text-label-xs text-secondary">Drag edges to adjust</span>
</div>
<!-- Bottom Drag Handle -->
<div class="absolute -bottom-3 left-1/2 -translate-x-1/2 w-8 h-6 flex items-center justify-center cursor-ns-resize opacity-0 group-hover:opacity-100 transition-opacity">
<div class="w-4 h-1 bg-primary rounded-full"></div>
</div>
</div>
<!-- Existing Block (Future) -->
<div class="absolute top-[192px] left-0 right-0 h-[96px] bg-surface-container-low border border-border-subtle rounded-md p-2 flex flex-col justify-start gap-1">
<div class="w-1 h-full absolute left-0 top-0 bg-priority-low rounded-l-md"></div>
<span class="font-subhead-sm text-subhead-sm text-on-surface ml-2">Team Sync</span>
<span class="font-label-xs text-label-xs text-text-muted ml-2">16:00 - 18:00</span>
</div>
<!-- Current Time Indicator -->
<div class="absolute top-[40px] left-[-40px] right-0 flex items-center z-30 pointer-events-none">
<span class="font-label-xs text-label-xs text-priority-high font-bold bg-surface px-1 text-[10px]">12:50</span>
<div class="w-2 h-2 rounded-full bg-priority-high -ml-1"></div>
<div class="h-px bg-priority-high flex-1"></div>
</div>
</div>
</div>
</section>
</main>
<!-- Action Bar (Sticky Bottom) -->
<div class="fixed bottom-0 w-full bg-surface border-t border-border-subtle p-md pb-safe z-40">
<div class="max-w-2xl mx-auto flex gap-md">
<button class="flex-1 h-touch-target bg-surface-container-low text-on-surface font-button-md text-button-md rounded-full hover:bg-surface-container-high transition-colors active:scale-95 duration-100">
                Cancel
            </button>
<button class="flex-[2] h-touch-target bg-primary-container text-on-primary font-button-md text-button-md rounded-full hover:opacity-90 transition-opacity active:scale-95 duration-100 shadow-sm flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-size: 20px;">check</span>
                Confirm Time
            </button>
</div>
</div>
</body></html>

<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add New Period</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "border-subtle": "#E5E7EB",
                        "on-primary": "#ffffff",
                        "surface-container-highest": "#e1e3e4",
                        "inverse-surface": "#2e3132",
                        "outline": "#777587",
                        "on-primary-fixed": "#0f0069",
                        "surface": "#FFFFFF",
                        "on-primary-container": "#dad7ff",
                        "primary": "#3525cd",
                        "surface-dim": "#d9dadb",
                        "on-secondary-fixed-variant": "#424751",
                        "tertiary-container": "#7531e6",
                        "surface-bright": "#f8f9fa",
                        "on-tertiary-fixed": "#25005a",
                        "primary-container": "#4f46e5",
                        "secondary": "#5a5e69",
                        "on-tertiary-container": "#e4d4ff",
                        "priority-low": "#10B981",
                        "text-main": "#111827",
                        "priority-medium": "#F59E0B",
                        "on-secondary-fixed": "#171c25",
                        "secondary-fixed-dim": "#c2c6d3",
                        "tertiary": "#5c00ca",
                        "inverse-on-surface": "#f0f1f2",
                        "secondary-container": "#dee2ef",
                        "outline-variant": "#c7c4d8",
                        "text-muted": "#6B7280",
                        "inverse-primary": "#c3c0ff",
                        "primary-fixed": "#e2dfff",
                        "surface-container-high": "#e7e8e9",
                        "surface-container": "#edeeef",
                        "surface-container-lowest": "#ffffff",
                        "on-error-container": "#93000a",
                        "background": "#f8f9fa",
                        "error": "#ba1a1a",
                        "on-surface": "#191c1d",
                        "on-secondary-container": "#60646f",
                        "surface-container-low": "#f3f4f5",
                        "surface-variant": "#e1e3e4",
                        "primary-fixed-dim": "#c3c0ff",
                        "on-primary-fixed-variant": "#3323cc",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#464555",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed": "#eaddff",
                        "on-tertiary-fixed-variant": "#5a00c6",
                        "tertiary-fixed-dim": "#d2bbff",
                        "priority-high": "#EF4444",
                        "on-background": "#191c1d",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#dee2ef",
                        "on-error": "#ffffff",
                        "surface-tint": "#4d44e3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "xs": "4px",
                        "sm": "8px",
                        "touch-target": "48px",
                        "md": "16px",
                        "margin-screen": "16px",
                        "lg": "24px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "button-md": ["Inter"],
                        "label-xs": ["Inter"],
                        "display-lg": ["Inter"],
                        "subhead-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "button-md": ["16px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "label-xs": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "display-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "subhead-sm": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-background/80 dark:bg-background/80 backdrop-blur-md bg-background dark:bg-background flex items-center justify-between px-md h-touch-target w-full">
<button aria-label="Close" class="flex items-center justify-center w-touch-target h-touch-target text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-95 duration-100 rounded-full">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface flex-1 text-center pr-touch-target">Add New Period</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-screen pt-[calc(theme(spacing.touch-target)+theme(spacing.lg))] pb-[calc(theme(spacing.touch-target)+theme(spacing.xl))] overflow-y-auto">
<div class="max-w-md mx-auto space-y-xl">
<!-- Label Input Section -->
<section class="space-y-sm">
<label class="block font-subhead-sm text-subhead-sm text-on-surface-variant" for="period-label">Label</label>
<div class="relative">
<input class="w-full bg-surface border border-border-subtle rounded-xl px-md py-3 font-body-md text-body-md text-on-surface placeholder:text-text-muted focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all shadow-sm" id="period-label" placeholder="e.g., Deep Work" type="text"/>
</div>
</section>
<!-- Period Type Toggle -->
<section class="space-y-sm">
<label class="block font-subhead-sm text-subhead-sm text-on-surface-variant">Period Type</label>
<div class="flex p-1 bg-surface-container-low rounded-xl border border-border-subtle shadow-sm">
<button class="flex-1 py-2 font-button-md text-button-md rounded-lg bg-surface text-primary shadow-sm ring-1 ring-border-subtle transition-all">Productive</button>
<button class="flex-1 py-2 font-button-md text-button-md rounded-lg text-secondary hover:bg-surface/50 transition-all">Life</button>
</div>
</section>
<!-- Time Selection Section -->
<section class="space-y-md bg-surface p-md rounded-xl border border-border-subtle shadow-sm">
<div class="flex items-center justify-between">
<h2 class="font-subhead-sm text-subhead-sm text-on-surface font-semibold">Time Range</h2>
<span class="font-label-xs text-label-xs text-text-muted bg-surface-container-low px-2 py-1 rounded-full">Available: 10:00 AM - 12:00 PM</span>
</div>
<div class="flex items-center space-x-4">
<div class="flex-1 space-y-sm">
<label class="block font-label-xs text-label-xs text-on-surface-variant" for="start-time">Start Time</label>
<select class="w-full bg-surface border border-border-subtle rounded-lg px-3 py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all appearance-none cursor-pointer" id="start-time">
<option value="10:00">10:00 AM</option>
<option value="10:30">10:30 AM</option>
<option value="11:00">11:00 AM</option>
<option value="11:30">11:30 AM</option>
</select>
</div>
<div class="flex-none pt-6 text-outline">
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</div>
<div class="flex-1 space-y-sm">
<label class="block font-label-xs text-label-xs text-on-surface-variant" for="end-time">End Time</label>
<select class="w-full bg-surface border border-border-subtle rounded-lg px-3 py-2 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all appearance-none cursor-pointer" id="end-time">
<option value="10:30">10:30 AM</option>
<option value="11:00">11:00 AM</option>
<option value="11:30">11:30 AM</option>
<option selected="" value="12:00">12:00 PM</option>
</select>
</div>
</div>
<!-- Visual Timeline Constraint -->
<div class="mt-4 pt-4 border-t border-border-subtle">
<div class="relative h-2 bg-surface-container-highest rounded-full overflow-hidden">
<!-- Represents 10am to 12pm block out of a larger day context visually -->
<div class="absolute left-1/4 right-1/4 h-full bg-primary-container rounded-full opacity-50"></div>
<div class="absolute left-1/4 right-1/4 h-full bg-primary rounded-full" style="width: 100%;"></div>
</div>
<div class="flex justify-between mt-1 px-1">
<span class="font-label-xs text-label-xs text-text-muted">10:00</span>
<span class="font-label-xs text-label-xs text-text-muted">12:00</span>
</div>
</div>
</section>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-md bg-surface border-t border-border-subtle shadow-md z-50">
<div class="max-w-md mx-auto">
<button class="w-full bg-primary text-on-primary font-button-md text-button-md py-4 rounded-full shadow-[0_4px_15px_rgba(0,0,0,0.1)] hover:opacity-90 active:scale-95 transition-all flex items-center justify-center space-x-2">
<span class="material-symbols-outlined" data-icon="add">add</span>
<span>Add Period</span>
</button>
</div>
</div>
</body></html>

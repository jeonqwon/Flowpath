<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks</title>
  <link rel="stylesheet" href="app-theme.css">
  <script src="mock-data.js"></script>
</head>
<body class="preview-body">
  <main class="app-screen has-sticky-header">
    <div class="topbar compact sticky-topbar">
      <h1 class="screen-title">Tuesday, Oct 6</h1>
      <a class="primary-button add-task-button" href="create_task.html?mode=task&from=tasks.html" aria-label="Add task">
        <span class="add-task-plus">+</span>
        <span>Add Task</span>
      </a>
    </div>

    <section class="timeline-shell">
      <div class="time-rail" id="timeRail"></div>
      <div class="timeline-layer" id="timelineLayer"></div>
    </section>

    <nav class="bottom-nav">
      <a class="nav-link active" href="tasks.html"><strong>Tasks</strong></a>
      <a class="nav-link" href="planner.html"><span>Planner</span></a>
      <a class="nav-link" href="reminders.html"><span>Reminders</span></a>
      <a class="nav-link" href="combined_settings_edit.html"><span>Settings</span></a>
    </nav>
  </main>

  <script>
    const timelineShell = document.querySelector('.timeline-shell');
    const timeRail = document.getElementById('timeRail');
    const timelineLayer = document.getElementById('timelineLayer');
    const scheduleDate = window.FocusPreviewData.DEFAULT_SCHEDULE_DATE;
    const dayStart = '08:00';
    const dayEnd = '23:00';
    const HOUR_HEIGHT = 96;
    const PREVIEW_NOW = '14:20';

    function renderRail() {
      const totalMinutes = window.FocusPreviewData.toMinutes(dayEnd) - window.FocusPreviewData.toMinutes(dayStart);
      const heightPx = (totalMinutes / 60) * HOUR_HEIGHT;
      timelineShell.style.minHeight = `${heightPx}px`;
      timelineLayer.style.minHeight = `${heightPx}px`;
      const labels = [];
      for (let minutes = window.FocusPreviewData.toMinutes(dayStart); minutes <= window.FocusPreviewData.toMinutes(dayEnd); minutes += 60) {
        const hh = String(Math.floor(minutes / 60)).padStart(2, '0');
        labels.push(`<div class="hour-label" style="top:${((minutes - window.FocusPreviewData.toMinutes(dayStart)) / 60) * HOUR_HEIGHT}px;">${hh}:00</div>`);
      }
      timeRail.innerHTML = labels.join('');
    }

    function renderTimeline() {
      const items = window.FocusPreviewData.daySegmentsForSchedule(scheduleDate, { includeReminders: false, dayStart, dayEnd });
      const nowMinutes = window.FocusPreviewData.toMinutes(PREVIEW_NOW);
      const nowTop = ((nowMinutes - window.FocusPreviewData.toMinutes(dayStart)) / 60) * HOUR_HEIGHT;

      timelineLayer.innerHTML = items.map((item) => {
        const start = window.FocusPreviewData.toMinutes(item.start);
        const end = window.FocusPreviewData.toMinutes(item.end);
        const top = ((start - window.FocusPreviewData.toMinutes(dayStart)) / 60) * HOUR_HEIGHT;
        const height = Math.max(((end - start) / 60) * HOUR_HEIGHT, 58);
        if (item.kind === 'life') {
          return `<article class="timeline-card card soft" style="top:${top}px; height:${height}px;">
            <div class="timeline-content">
              <h3 class="timeline-title">${item.title}</h3>
            </div>
          </article>`;
        }
        const isActiveNow = nowMinutes >= start && nowMinutes < end;
        return `<article class="timeline-card task-card card task-link-card ${isActiveNow ? 'active-now' : ''}" data-task-id="${item.id}" tabindex="0" role="button" style="top:${top}px; height:${height}px;">
          <div class="timeline-content">
            <h3 class="timeline-title">${item.title}</h3>
          </div>
        </article>`;
      }).join('') + (nowTop >= 0 && nowTop <= ((window.FocusPreviewData.toMinutes(dayEnd) - window.FocusPreviewData.toMinutes(dayStart)) / 60) * HOUR_HEIGHT
        ? `<div class="now-line" style="top:${nowTop}px;">
            <span class="now-dot"></span>
            <span class="now-track"></span>
          </div>`
        : '');

      timelineLayer.querySelectorAll('.task-link-card').forEach((card) => {
        card.addEventListener('click', () => {
          window.location.href = `task_detail.html?id=${card.dataset.taskId}&from=tasks.html`;
        });
        card.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            window.location.href = `task_detail.html?id=${card.dataset.taskId}&from=tasks.html`;
          }
        });
      });
    }

    renderRail();
    renderTimeline();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Detail</title>
  <link rel="stylesheet" href="app-theme.css">
  <script src="mock-data.js"></script>
</head>
<body class="preview-body">
  <main class="app-screen detail-screen">
    <div class="topbar compact">
      <a class="circle-button" id="backLink" href="tasks.html" aria-label="Back">&larr;</a>
      <h1 class="screen-title detail-screen-title">Details</h1>
      <div style="width:36px;"></div>
    </div>

    <section class="card detail-hero" id="detailCard">
      <div class="detail-kicker">
        <span class="detail-priority hidden" id="priorityPill">Urgent</span>
      </div>
      <h2 class="detail-title" id="taskTitle">Task</h2>
      <div class="detail-schedule-line">
        <span class="detail-kicker-date" id="headerDate">Oct 6</span>
        <span class="detail-schedule-separator">·</span>
        <span class="detail-time" id="taskTime">9:00 AM - 10:30 AM</span>
      </div>
      <p class="detail-copy" id="taskDescription">Task details appear here.</p>
    </section>

    <section class="card detail-meta-card">
      <div class="detail-meta-row">
        <span class="detail-meta-label">Due</span>
        <span class="detail-meta-value" id="dueValue">Oct 6 at 10:30 AM</span>
      </div>
      <div class="detail-meta-row">
        <span class="detail-meta-label">Preferred period</span>
        <span class="detail-meta-value" id="periodValue">Afternoon</span>
      </div>
      <div class="detail-meta-row">
        <span class="detail-meta-label">Reminder</span>
        <span class="detail-meta-value" id="reminderValue">Not added</span>
      </div>
    </section>

    <div class="detail-backdrop hidden" id="rescheduleBackdrop"></div>
    <section class="card detail-dropdown hidden" id="rescheduleSheet">
      <div class="detail-dropdown-head">Reschedule</div>
      <div class="stack">
        <button class="sheet-option picker-option" type="button" data-reschedule="urgent">
          <span class="picker-option-title">Urgently</span>
        </button>
        <button class="sheet-option picker-option" type="button" data-reschedule="week">
          <span class="picker-option-title">Later this week</span>
        </button>
        <button class="sheet-option picker-option" type="button" id="dueDateToggle">
          <span class="picker-option-title">Change due date</span>
        </button>
      </div>
      <div class="field hidden schedule-due-date" id="dueDateSection">
        <span class="create-field-kicker">Due date</span>
        <div class="select-wrap">
          <input class="selection-row input-like app-select" id="rescheduleDateInput" type="date">
          <span class="selection-icon">&#8964;</span>
        </div>
        <button class="primary-button" id="applyDueDateButton" type="button">Save new date</button>
      </div>
    </section>

    <div class="detail-action-bar">
      <button class="secondary-button detail-action-button" id="reminderButton" type="button">Make Reminder</button>
      <button class="secondary-button detail-action-button" id="rescheduleButton" type="button">Reschedule</button>
      <button class="primary-button detail-action-button" id="doneButton" type="button">Done</button>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const taskId = params.get('id');
    const from = params.get('from') || 'tasks.html';
    const backLink = document.getElementById('backLink');
    const titleEl = document.getElementById('taskTitle');
    const timeEl = document.getElementById('taskTime');
    const descriptionEl = document.getElementById('taskDescription');
    const dueValue = document.getElementById('dueValue');
    const periodValue = document.getElementById('periodValue');
    const reminderValue = document.getElementById('reminderValue');
    const headerDate = document.getElementById('headerDate');
    const priorityPill = document.getElementById('priorityPill');
    const reminderButton = document.getElementById('reminderButton');
    const rescheduleButton = document.getElementById('rescheduleButton');
    const doneButton = document.getElementById('doneButton');
    const rescheduleBackdrop = document.getElementById('rescheduleBackdrop');
    const sheet = document.getElementById('rescheduleSheet');
    const dueDateToggle = document.getElementById('dueDateToggle');
    const dueDateSection = document.getElementById('dueDateSection');
    const rescheduleDateInput = document.getElementById('rescheduleDateInput');
    const applyDueDateButton = document.getElementById('applyDueDateButton');

    backLink.href = from;

    function currentTask() {
      return window.FocusPreviewData.loadTasks().find((task) => task.id === taskId);
    }

    function updateReminderState(task) {
      const linked = window.FocusPreviewData.linkedRemindersForTask(task.id);
      if (linked.length) {
        const reminder = linked[0];
        reminderValue.textContent = `${window.FocusPreviewData.formatShortDate(reminder.date)} at ${window.FocusPreviewData.formatTime(reminder.time)}`;
        reminderButton.textContent = 'Reminder Added';
        reminderButton.disabled = true;
      } else {
        reminderValue.textContent = 'Not added';
        reminderButton.textContent = 'Make Reminder';
        reminderButton.disabled = false;
      }
    }

    function render() {
      const task = currentTask();
      if (!task) {
        titleEl.textContent = 'Task not found';
        timeEl.textContent = '';
        descriptionEl.textContent = 'This task is no longer available.';
        dueValue.textContent = '';
        periodValue.textContent = '';
        reminderValue.textContent = '';
        headerDate.textContent = '';
        reminderButton.disabled = true;
        rescheduleButton.disabled = true;
        doneButton.disabled = true;
        return;
      }

      titleEl.textContent = task.title;
      timeEl.textContent = window.FocusPreviewData.formatRange(task.start, task.end);
      descriptionEl.textContent = task.description || 'No description added.';
      dueValue.textContent = `${window.FocusPreviewData.formatShortDate(task.dueDate)} at ${window.FocusPreviewData.formatTime(task.dueTime)}`;
      periodValue.textContent = task.preferredPeriod || 'Not set';
      headerDate.textContent = window.FocusPreviewData.formatShortDate(task.scheduleDate || task.dueDate);
      if (task.priority === 'urgent') {
        priorityPill.textContent = 'Urgent';
        priorityPill.className = 'detail-priority urgent';
      } else {
        priorityPill.textContent = '';
        priorityPill.className = 'detail-priority hidden';
      }
      updateReminderState(task);
    }

    function closeSheet() {
      rescheduleBackdrop.classList.add('hidden');
      sheet.classList.add('hidden');
      dueDateSection.classList.add('hidden');
    }

    reminderButton.addEventListener('click', () => {
      const task = currentTask();
      if (!task) return;
      window.FocusPreviewData.createReminderForTask(task.id);
      render();
    });

    rescheduleButton.addEventListener('click', () => {
      const task = currentTask();
      if (task) {
        rescheduleDateInput.value = task.dueDate || task.scheduleDate || window.FocusPreviewData.DEFAULT_SCHEDULE_DATE;
      }
      rescheduleBackdrop.classList.remove('hidden');
      sheet.classList.toggle('hidden');
    });
    rescheduleBackdrop.addEventListener('click', closeSheet);
    document.addEventListener('click', (event) => {
      if (sheet.classList.contains('hidden')) return;
      if (sheet.contains(event.target) || rescheduleButton.contains(event.target) || rescheduleBackdrop.contains(event.target)) return;
      closeSheet();
    });

    document.querySelectorAll('[data-reschedule]').forEach((button) => {
      button.addEventListener('click', () => {
        const task = currentTask();
        if (!task) return;
        window.FocusPreviewData.rescheduleTask(task.id, button.dataset.reschedule);
        closeSheet();
        window.location.href = from;
      });
    });

    dueDateToggle.addEventListener('click', () => {
      dueDateSection.classList.toggle('hidden');
    });

    applyDueDateButton.addEventListener('click', () => {
      const task = currentTask();
      if (!task || !rescheduleDateInput.value) return;
      window.FocusPreviewData.rescheduleTask(task.id, 'due-date', { dueDate: rescheduleDateInput.value });
      closeSheet();
      window.location.href = from;
    });

    doneButton.addEventListener('click', () => {
      const task = currentTask();
      if (!task) return;
      window.FocusPreviewData.hideTask(task.id);
      window.location.href = from;
    });

    render();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add New Period</title>
  <link rel="stylesheet" href="app-theme.css">
  <script src="mock-data.js"></script>
</head>
<body class="preview-body">
  <main class="app-screen">
    <div class="topbar compact">
      <a class="circle-button" href="combined_settings_edit.html" aria-label="Back">&larr;</a>
      <h1 class="screen-title">Add New Period</h1>
      <div style="width:36px;"></div>
    </div>

    <section class="stack">
      <div class="field">
        <label class="field-label" for="periodLabel">Label</label>
        <input class="text-input" id="periodLabel" type="text" value="New Period">
      </div>

      <div class="field">
        <span class="field-label">Period Type</span>
        <div class="chip-row">
          <button class="chip active" data-period-type="productive" type="button">Productive</button>
          <button class="chip" data-period-type="life" type="button">Life</button>
        </div>
      </div>

      <section class="card" style="padding:18px 16px;">
        <div class="timeline-title" style="margin-bottom:4px;">Time Range</div>
        <div style="position:relative; height:34px; display:flex; align-items:center; margin-top:10px;">
          <div style="position:relative; width:100%; height:10px; border-radius:999px; background:#e6e8f1;">
            <div style="position:absolute; inset:0; border-radius:999px; background:rgba(79,70,229,0.16);"></div>
            <div id="selectionBar" style="position:absolute; top:0; height:100%; border-radius:999px; background:var(--accent);"></div>
            <div id="startHandle" style="position:absolute; top:50%; width:24px; height:24px; border-radius:999px; background:var(--surface); border:3px solid var(--accent); transform:translate(-50%, -50%); box-shadow:0 6px 16px rgba(79,70,229,0.18); pointer-events:none;"></div>
            <div id="endHandle" style="position:absolute; top:50%; width:24px; height:24px; border-radius:999px; background:var(--surface); border:3px solid var(--accent); transform:translate(-50%, -50%); box-shadow:0 6px 16px rgba(79,70,229,0.18); pointer-events:none;"></div>
          </div>
          <input id="startSlider" class="stealth-range" type="range" step="1">
          <input id="endSlider" class="stealth-range" type="range" step="1">
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:10px; color:var(--muted); font-size:12px;">
          <span id="trackStart"></span>
          <span id="trackEnd"></span>
        </div>
      </section>

      <button class="primary-button" id="savePeriodButton" type="button">Save Period</button>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const periodId = params.get('id') || '';
    const periodName = params.get('name') || 'New Period';
    const initialType = params.get('type') || 'productive';
    const slotStart = params.get('start') || '17:00';
    const slotEnd = params.get('end') || '19:00';
    const startSlider = document.getElementById('startSlider');
    const endSlider = document.getElementById('endSlider');
    const trackStart = document.getElementById('trackStart');
    const trackEnd = document.getElementById('trackEnd');
    const selectionBar = document.getElementById('selectionBar');
    const startHandle = document.getElementById('startHandle');
    const endHandle = document.getElementById('endHandle');
    const periodLabel = document.getElementById('periodLabel');
    const typeButtons = [...document.querySelectorAll('[data-period-type]')];
    const savePeriodButton = document.getElementById('savePeriodButton');
    let periodType = initialType;

    function toMinutes(time) {
      const [h, m] = time.split(':').map(Number);
      return h * 60 + m;
    }

    function toTime(minutes) {
      const h = String(Math.floor(minutes / 60)).padStart(2, '0');
      const m = String(minutes % 60).padStart(2, '0');
      return `${h}:${m}`;
    }

    function formatTime(time) {
      const [rawH, rawM] = time.split(':').map(Number);
      const suffix = rawH >= 12 ? 'PM' : 'AM';
      const h = rawH % 12 || 12;
      return `${h}:${String(rawM).padStart(2, '0')} ${suffix}`;
    }

    function buildRange(start, end) {
      const values = [];
      for (let current = toMinutes(start); current <= toMinutes(end); current += 30) {
        values.push(toTime(current));
      }
      return values;
    }

    const values = buildRange(slotStart, slotEnd);
    let startIndex = 0;
    let endIndex = Math.min(1, values.length - 1);
    startSlider.min = '0';
    startSlider.max = String(Math.max(values.length - 2, 0));
    endSlider.min = '1';
    endSlider.max = String(Math.max(values.length - 1, 1));

    periodLabel.value = periodName;
    typeButtons.forEach((button) => {
      button.classList.toggle('active', button.dataset.periodType === periodType);
    });

    const existingStartIndex = values.indexOf(slotStart);
    const existingEndIndex = values.indexOf(slotEnd);
    if (existingStartIndex >= 0) startIndex = existingStartIndex;
    if (existingEndIndex > existingStartIndex) endIndex = existingEndIndex;

    function render() {
      startSlider.value = String(startIndex);
      endSlider.value = String(endIndex);
      const total = toMinutes(slotEnd) - toMinutes(slotStart);
      const startMinutes = toMinutes(values[startIndex]);
      const endMinutes = toMinutes(values[endIndex]);
      const left = ((startMinutes - toMinutes(slotStart)) / total) * 100;
      const width = ((endMinutes - startMinutes) / total) * 100;
      const end = ((endMinutes - toMinutes(slotStart)) / total) * 100;
      selectionBar.style.left = `${left}%`;
      selectionBar.style.width = `${width}%`;
      startHandle.style.left = `${left}%`;
      endHandle.style.left = `${end}%`;
      trackStart.textContent = formatTime(slotStart);
      trackEnd.textContent = formatTime(slotEnd);
    }

    startSlider.addEventListener('input', () => {
      startIndex = Number(startSlider.value);
      if (startIndex >= endIndex) {
        endIndex = Math.min(startIndex + 1, values.length - 1);
      }
      render();
    });

    endSlider.addEventListener('input', () => {
      endIndex = Number(endSlider.value);
      if (endIndex <= startIndex) {
        startIndex = Math.max(endIndex - 1, 0);
      }
      render();
    });

    typeButtons.forEach((button) => {
      button.addEventListener('click', () => {
        typeButtons.forEach((item) => item.classList.remove('active'));
        button.classList.add('active');
        periodType = button.dataset.periodType;
      });
    });

    savePeriodButton.addEventListener('click', () => {
      window.FocusPreviewData.upsertPeriod({
        id: periodId || undefined,
        name: periodLabel.value.trim() || 'New Period',
        start: values[startIndex],
        end: values[endIndex],
        type: periodType
      });
      window.location.href = 'combined_settings_edit.html';
    });

    render();
  </script>
</body>
</html>

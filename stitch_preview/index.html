<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stitch Mobile Preview</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #111318;
      --panel: #1a1d24;
      --panel-border: #2a2f3a;
      --text: #f5f7fb;
      --muted: #a6afc3;
      --accent: #5b4df6;
      --frame: #0c0e13;
      --screen: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      background:
        radial-gradient(circle at top, rgba(91, 77, 246, 0.18), transparent 30%),
        var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .shell {
      width: min(1120px, 100%);
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    .controls {
      background: rgba(26, 29, 36, 0.88);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      padding: 20px;
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.1;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }

    .screen-list {
      display: grid;
      gap: 10px;
    }

    .screen-button {
      width: 100%;
      border: 1px solid #31384a;
      border-radius: 16px;
      background: #202530;
      color: var(--text);
      padding: 14px 16px;
      text-align: left;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 140ms ease;
    }

    .screen-button:hover {
      border-color: #4d56ff;
      transform: translateY(-1px);
    }

    .screen-button.active {
      background: linear-gradient(180deg, #5b4df6, #4a3ee0);
      border-color: transparent;
      box-shadow: 0 12px 24px rgba(91, 77, 246, 0.35);
    }

    .preview {
      display: grid;
      place-items: center;
    }

    .phone-frame {
      width: 390px;
      height: 844px;
      max-width: calc(100vw - 48px);
      max-height: calc(100vh - 48px);
      aspect-ratio: 390 / 844;
      background: var(--frame);
      border-radius: 36px;
      padding: 12px;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45),
        inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 28px;
      background: var(--screen);
      overflow: hidden;
    }

    .meta {
      margin-top: 18px;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .controls {
        order: 2;
      }

      .preview {
        order: 1;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="controls">
      <h1>Mobile Stitch Preview</h1>
      <p>Phone-sized localhost preview for the exported UI screens. The frame stays constrained to a real mobile viewport.</p>
      <div class="screen-list">
        <button class="screen-button active" data-src="combined_settings_edit.html">Settings</button>
        <button class="screen-button" data-src="tasks.html">Tasks</button>
        <button class="screen-button" data-src="reminders.html">Reminders</button>
        <button class="screen-button" data-src="create_task.html?mode=task&from=tasks.html">Create Task</button>
        <button class="screen-button" data-src="create_task.html?mode=reminder&from=reminders.html">Create Reminder</button>
        <button class="screen-button" data-src="planner.html">Planner</button>
        <button class="screen-button" data-src="day_view.html">Day View</button>
        <button class="screen-button" data-src="task_detail.html?id=t1&from=tasks.html">Task Detail</button>
        <button class="screen-button" data-src="reschedule.html">Reschedule</button>
        <button class="screen-button" data-src="add_new_period_dynamic.html">Add New Period</button>
      </div>
      <div class="meta">Viewport: 390 × 844</div>
    </section>

    <section class="preview">
      <div class="phone-frame">
        <iframe id="screenFrame" class="phone-screen" src="combined_settings_edit.html" title="Mobile UI preview"></iframe>
      </div>
    </section>
  </main>

  <script>
    const buttons = [...document.querySelectorAll('.screen-button')];
    const frame = document.getElementById('screenFrame');

    for (const button of buttons) {
      button.addEventListener('click', () => {
        for (const item of buttons) item.classList.remove('active');
        button.classList.add('active');
        frame.src = button.dataset.src;
      });
    }
  </script>
</body>
</html>

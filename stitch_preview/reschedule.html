<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reschedule</title>
  <link rel="stylesheet" href="app-theme.css">
</head>
<body class="preview-body">
  <main class="app-screen">
    <div class="topbar compact">
      <a class="circle-button" href="day_view.html" aria-label="Back">←</a>
      <h1 class="screen-title">Reschedule</h1>
      <div style="width:36px;"></div>
    </div>

    <section class="timeline-shell" style="min-height:540px;">
      <div class="time-rail">
        <div class="hour-label" style="top:8%;">14:00</div>
        <div class="hour-label" style="top:42%;">15:30</div>
        <div class="hour-label" style="top:72%;">17:00</div>
      </div>
      <div class="timeline-layer" style="min-height:540px;">
        <article class="timeline-card card" style="top:8%; height:22%;">
          <div class="timeline-content">
            <h3 class="timeline-title">Midday Focus</h3>
            <p class="timeline-meta">Current slot · 2:00 PM - 3:30 PM</p>
          </div>
        </article>
      </div>
    </section>

    <section class="sheet card">
      <div class="sheet-handle"></div>
      <h2 class="sheet-title">Reschedule options</h2>
      <div class="stack">
        <button class="secondary-button">Reschedule urgently</button>
        <button class="secondary-button">Later today</button>
        <button class="secondary-button">Later this week</button>
        <button class="secondary-button">Let scheduler decide</button>
      </div>
    </section>

    <nav class="bottom-nav">
      <a class="nav-link" href="tasks.html"><span>Tasks</span></a>
      <a class="nav-link active" href="planner.html"><strong>Planner</strong></a>
      <a class="nav-link" href="reminders.html"><span>Reminders</span></a>
      <a class="nav-link" href="combined_settings_edit.html"><span>Settings</span></a>
    </nav>
  </main>
</body>
</html>
